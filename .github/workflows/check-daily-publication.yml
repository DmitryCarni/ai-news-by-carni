name: Check Daily publication end-to-end

on:
  schedule:
    # 08:00, 12:00, 19:00 Asia/Aqtobe (UTC+5); GitHub cron may be delayed.
    - cron: '0 3,7,14 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional YYYY-MM-DD report date; otherwise yesterday Asia/Aqtobe
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-daily-publication.yml'
      - 'scripts/check_daily_publication.py'
      - 'scripts/test_check_daily_publication.py'
  pull_request:
    paths:
      - '.github/workflows/check-daily-publication.yml'
      - 'scripts/check_daily_publication.py'
      - 'scripts/test_check_daily_publication.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test fail-closed observer and date validation
        run: python -m unittest scripts.test_check_daily_publication -v

      - name: Inspect actual public 4/4, Telegram identities, and content
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date || '' }}
          EVENT_TYPE: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Code PRs use a confirmed historical fixture, never a not-yet-due report.
          if [ "$EVENT_TYPE" = 'pull_request' ] || [ "$EVENT_TYPE" = 'push' ]; then
            date='2026-10-09'
          else
            date="$REPORT_DATE"
          fi
          git fetch --no-tags origin refs/heads/telegram-state
          if [ -n "$date" ]; then
            python scripts/check_daily_publication.py --report-date "$date"
          else
            python scripts/check_daily_publication.py
          fi
          python scripts/verify_daily_completeness.py

      - name: Confirm Pages RU/EN are publicly reachable
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date || '' }}
        run: |
          set -euo pipefail
          date="$REPORT_DATE"
          if [ -z "$date" ]; then
            date="$(TZ=Asia/Aqtobe date -d 'yesterday' +%F)"
          fi
          [[ "$date" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
          for segment in "daily/$date/" "en/daily/$date/"; do
            url="https://news.carni.ltd/$segment"
            status="$(curl --location --silent --show-error --retry 2 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' "$url")"
            if [ "$status" != '200' ]; then
              echo "::error::P0 public Pages unavailable ($status): $url"
              exit 1
            fi
            echo "PUBLIC PAGES HTTP 200: $url"
          done
