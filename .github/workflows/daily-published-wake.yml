name: Signal verified Daily publication to Supabase

# Deliberately NOT a push workflow: GITHUB_TOKEN pushes do not create push runs.
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Exact published Daily YYYY-MM-DD
        required: true
        type: string
      public_commit:
        description: Exact public commit SHA after push
        required: true
        type: string
      mode:
        description: Verify without enqueueing, or enqueue a durable wake
        required: true
        type: choice
        options:
          - check
          - enqueue
        default: check

# No checkout, no private PAT, no GitHub resource write permissions.
permissions:
  id-token: write

concurrency:
  group: daily-published-wake-${{ inputs.report_date }}
  cancel-in-progress: false

jobs:
  signal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify inputs and signal via GitHub OIDC
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          PUBLIC_COMMIT: ${{ inputs.public_commit }}
          MODE: ${{ inputs.mode }}
          RECEIVER: https://qbsovyjwnxmryokekypf.supabase.co/functions/v1/daily-published-wake
        run: |
          set -euo pipefail
          [[ "${REPORT_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
          [[ "${PUBLIC_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "${MODE}" == "check" || "${MODE}" == "enqueue" ]] || exit 2
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || exit 2
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || exit 2

          oidc="$(curl --fail --silent --show-error --max-time 10 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=carni-ai-news-wake" \
            | jq -er '.value | select(type == "string" and length > 50)')"
          request="$(jq -cn \
            --arg date "${REPORT_DATE}" --arg sha "${PUBLIC_COMMIT}" --arg mode "${MODE}" \
            '{report_date:$date,public_commit:$sha,mode:$mode}')"
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT

          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --max-time 35 \
              --output "${response}" --write-out '%{http_code}' \
              -X POST "${RECEIVER}" \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${oidc}" \
              --data-binary "${request}" || true)"
            if [[ "${status}" == "200" ]] && jq -e '.ok == true and .verified == true' "${response}" >/dev/null; then
              echo "Daily identity independently verified by Supabase; mode=${MODE}"
              if [[ "${MODE}" == "enqueue" ]]; then
                jq -r '"Durable wake id: " + (.requestId|tostring)' "${response}"
              fi
              exit 0
            fi
            if [[ "${status}" =~ ^(400|401|403|409|413|422)$ ]]; then
              echo "Permanent OIDC/published-identity rejection (HTTP ${status})" >&2
              exit 1
            fi
            echo "Temporary signal failure (attempt ${attempt}/3, HTTP ${status})" >&2
            if (( attempt < 3 )); then sleep $((5 * attempt)); fi
          done
          echo "Wake signal not acknowledged after retries" >&2
          exit 1
