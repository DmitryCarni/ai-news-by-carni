name: Publish verified Radar staging

on:
  workflow_run:
    workflows:
      - Verify Radar staging transaction
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-auto-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'radar/daily-') ||
       startsWith(github.event.workflow_run.head_branch, 'radar/weekly-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact verified bundle to current main
        shell: bash
        env:
          STAGING_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin main "${STAGING_BRANCH}:refs/remotes/origin/${STAGING_BRANCH}"
          actual_sha="$(git rev-parse "origin/${STAGING_BRANCH}")"
          [[ "${actual_sha}" == "${VERIFIED_SHA}" ]] || { echo "stale verified SHA" >&2; exit 1; }

          if [[ "${STAGING_BRANCH}" == radar/daily-* ]]; then
            token="${STAGING_BRANCH#radar/daily-}"
            expected=("daily/${token}.md" "en/daily/${token}.md" "_telegram/daily/${token}.txt" "_telegram/en/daily/${token}.txt")
            verifier=(python scripts/verify_daily_completeness.py)
            kind="Daily"
            telegram_files="_telegram/daily/${token}.txt,_telegram/en/daily/${token}.txt"
          else
            token="${STAGING_BRANCH#radar/weekly-}"
            expected=("weekly/${token}.md" "en/weekly/${token}.md" "_telegram/weekly/${token}.txt" "_telegram/en/weekly/${token}.txt")
            verifier=(python scripts/verify_weekly_completeness.py)
            kind="Weekly"
            telegram_files="_telegram/weekly/${token}.txt,_telegram/en/weekly/${token}.txt"
          fi

          git fetch --no-tags origin main
          git reset --hard origin/main
          git checkout "${VERIFIED_SHA}" -- "${expected[@]}"
          "${verifier[@]}"

          # git checkout <commit> -- paths updates BOTH the index and worktree.
          # Therefore the publication diff is staged; plain `git diff` compares
          # worktree vs index and falsely reports "no changes".
          if git diff --cached --quiet -- "${expected[@]}"; then
            echo "Bundle already present on main."
            echo "PUBLISHED=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          changed="$(git diff --cached --name-only | sort)"
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort)"
          [[ "${changed}" == "${expected_sorted}" ]] || { echo "unexpected working-tree diff" >&2; exit 1; }

          git add -- "${expected[@]}"
          git commit -m "Publish ${kind} ${token} from verified Radar staging"
          git push origin HEAD:main
          # Record the EXACT just-pushed publication identity for OIDC handoff.
          public_commit="$(git rev-parse HEAD)"
          [[ "${public_commit}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "PUBLIC_COMMIT=${public_commit}" >> "${GITHUB_ENV}"

          echo "PUBLISHED=true" >> "${GITHUB_ENV}"
          echo "PUBLISHED_KIND=${kind}" >> "${GITHUB_ENV}"
          echo "PUBLISHED_TOKEN=${token}" >> "${GITHUB_ENV}"
          echo "TELEGRAM_FILES=${telegram_files}" >> "${GITHUB_ENV}"

      - name: Dispatch Telegram and IndexNow after bot push
        if: env.PUBLISHED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run telegram.yml --ref main -f source_files="${TELEGRAM_FILES}"
          gh workflow run indexnow.yml --ref main
          if [[ "${PUBLISHED_KIND}" == "Daily" ]]; then
            gh workflow run verify-daily-completeness.yml --ref main
          else
            gh workflow run verify-weekly-completeness.yml --ref main
          fi

      - name: Signal Daily to Supabase after confirmed public push
        # Independent of Telegram/IndexNow success: a failed distribution dispatch
        # must never erase the already verified business publication event.
        if: ${{ always() && env.PUBLISHED == 'true' && env.PUBLISHED_KIND == 'Daily' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PUBLISHED_TOKEN}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
          [[ "${PUBLIC_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          gh workflow run daily-published-wake.yml --ref main \
            -f "report_date=${PUBLISHED_TOKEN}" \
            -f "public_commit=${PUBLIC_COMMIT}" \
            -f "mode=enqueue"
