name: Build Carni Shorts ElevenLabs pilot

on:
  push:
    branches: [main]
    paths:
      - 'shorts/manifests/**/*.json'
      - 'shorts/renderer/**'
      - 'shorts/audio/**'
      - 'shorts/schema/**'
      - '.github/workflows/shorts-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          google-chrome --version || google-chrome-stable --version
          ffmpeg -filters | grep -E 'ass|subtitles'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check jsonschema playwright qrcode[pil]

      - name: Verify ElevenLabs secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ELEVENLABS_API_KEY:-}" ]]; then
            echo "ELEVENLABS_API_KEY is missing"
            exit 1
          fi
          echo "ElevenLabs secret is configured."

      - name: Build ElevenLabs voiced Shorts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/shorts
          mapfile -d '' MANIFESTS < <(find shorts/manifests -type f -name '*.json' -print0 2>/dev/null || true)
          if (( ${#MANIFESTS[@]} == 0 )); then
            echo 'No Shorts manifests found; nothing to build.'
            exit 0
          fi
          for manifest in "${MANIFESTS[@]}"; do
            echo "Rendering ${manifest}"
            python shorts/renderer/render.py "${manifest}" --output-dir build/shorts
            echo "Adding ElevenLabs v3 voice + scene-aware captions to ${manifest}"
            python shorts/audio/add_voiceover.py "${manifest}" --output-dir build/shorts
          done

      - name: Validate generated MP4 files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/shorts/*.mp4)
          if (( ${#files[@]} == 0 )); then
            echo 'No MP4 files generated.'
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Validating ${file}"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 "${file}"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 "${file}"
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "${file}"
          done

      - name: Upload ElevenLabs pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: carni-shorts-elevenlabs-${{ github.run_number }}
          path: |
            build/shorts/*.mp4
            build/shorts/*.ass
            build/shorts/*.voice.json
          if-no-files-found: error
          retention-days: 14
