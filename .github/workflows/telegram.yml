name: Publish Telegram teaser

on:
  push:
    branches: [main]
    paths:
      - '_telegram/**/*.txt'

permissions:
  contents: read

env:
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  RU_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  EN_CHAT_ID: '-1004292228334'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find teasers and publish
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BOT_TOKEN}" ]]; then
            echo "Telegram bot token is not configured; skipping publication."
            exit 0
          fi

          mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep '^_telegram/.*\.txt$' || true)
          if (( ${#FILES[@]} == 0 )); then
            echo "No Telegram teaser files found in this commit."
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            if [[ "${FILE}" == _telegram/en/* ]]; then
              CHAT_ID="${EN_CHAT_ID}"
              EDITION="EN"
            else
              CHAT_ID="${RU_CHAT_ID}"
              EDITION="RU"
            fi

            if [[ -z "${CHAT_ID}" ]]; then
              echo "${EDITION} Telegram chat id is not configured; skipping ${FILE}."
              continue
            fi

            SIZE="$(wc -c < "${FILE}")"
            if (( SIZE > 15000 )); then
              echo "Teaser file is unexpectedly large (${SIZE} bytes): ${FILE}"
              exit 1
            fi

            echo "Publishing ${FILE} to ${EDITION} channel."
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text@${FILE}" \
              --data-urlencode "disable_web_page_preview=false"
          done
