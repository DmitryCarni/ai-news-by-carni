name: Publish Telegram teaser

on:
  push:
    branches: [main]
    paths:
      - '_telegram/**/*.txt'

permissions:
  contents: write

concurrency:
  group: telegram-publish-state
  cancel-in-progress: false

env:
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  RU_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  EN_CHAT_ID: '-1004292228334'
  STATE_BRANCH: telegram-state

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Publish or edit teasers
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BOT_TOKEN}" ]]; then
            echo "Telegram bot token is not configured; skipping publication."
            exit 0
          fi

          telegram_call() {
            local method="$1"
            shift
            local response
            response="$(curl --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/${method}" \
              "$@")"

            if [[ "$(jq -r '.ok // false' <<<"${response}")" != "true" ]]; then
              local description
              description="$(jq -r '.description // "unknown Telegram API error"' <<<"${response}")"
              if [[ "${method}" == "editMessageText" && "${description}" == *"message is not modified"* ]]; then
                echo "Telegram message already has this text; nothing to edit." >&2
                printf '%s' "${response}"
                return 0
              fi
              echo "Telegram ${method} failed: ${description}" >&2
              return 1
            fi

            printf '%s' "${response}"
          }

          mapfile -t CHANGES < <(
            git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" |
              awk -F '\t' '$2 ~ /^_telegram\/.*\.txt$/ && ($1 == "A" || $1 == "M") {print $1 "\t" $2}'
          )

          if (( ${#CHANGES[@]} == 0 )); then
            echo "No added or modified Telegram teaser files found in this commit."
            exit 0
          fi

          # Telegram publication state lives on a dedicated branch. This keeps
          # technical message-id commits out of main, so they cannot trigger a
          # GitHub Pages rebuild. Workflow-level concurrency serializes writers.
          git fetch --quiet origin \
            "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"

          STATE_WORKTREE="${RUNNER_TEMP}/telegram-state"
          rm -rf "${STATE_WORKTREE}"
          git worktree add --detach "${STATE_WORKTREE}" "origin/${STATE_BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          read_state() {
            local state_file="$1"
            if [[ -f "${STATE_WORKTREE}/${state_file}" ]]; then
              cat "${STATE_WORKTREE}/${state_file}"
              return 0
            fi
            return 1
          }

          persist_state() {
            local state_file="$1"
            local source_file="$2"
            local edition="$3"
            local message_id="$4"

            mkdir -p "${STATE_WORKTREE}/$(dirname "${state_file}")"
            jq -n \
              --arg source_file "${source_file}" \
              --arg edition "${edition}" \
              --argjson message_id "${message_id}" \
              '{source_file: $source_file, edition: $edition, message_id: $message_id}' \
              > "${STATE_WORKTREE}/${state_file}"

            git -C "${STATE_WORKTREE}" add "${state_file}"
            git -C "${STATE_WORKTREE}" commit \
              -m "Track Telegram message id for ${source_file}"
            git -C "${STATE_WORKTREE}" push origin "HEAD:${STATE_BRANCH}"

            echo "Stored Telegram message_id ${message_id} on ${STATE_BRANCH}:${state_file}."
          }

          for CHANGE in "${CHANGES[@]}"; do
            STATUS="${CHANGE%%$'\t'*}"
            FILE="${CHANGE#*$'\t'}"
            STATE_FILE="_telegram/.state/${FILE#_telegram/}"
            STATE_FILE="${STATE_FILE%.txt}.json"

            if [[ "${FILE}" == _telegram/en/* ]]; then
              CHAT_ID="${EN_CHAT_ID}"
              EDITION="EN"
            else
              CHAT_ID="${RU_CHAT_ID}"
              EDITION="RU"
            fi

            if [[ -z "${CHAT_ID}" ]]; then
              echo "${EDITION} Telegram chat id is not configured; skipping ${FILE}."
              continue
            fi

            SIZE="$(wc -c < "${FILE}")"
            if (( SIZE > 15000 )); then
              echo "Teaser file is unexpectedly large (${SIZE} bytes): ${FILE}"
              exit 1
            fi

            STATE_JSON=""

            # A re-run of an add commit must edit the known message rather than
            # create another one if state was already persisted successfully.
            if STATE_JSON="$(read_state "${STATE_FILE}")"; then
              STATUS="M"
            fi

            if [[ "${STATUS}" == "A" ]]; then
              echo "Publishing new ${FILE} to ${EDITION} channel."
              RESPONSE="$(telegram_call sendMessage \
                --data-urlencode "chat_id=${CHAT_ID}" \
                --data-urlencode "text@${FILE}" \
                --data-urlencode "disable_web_page_preview=false")"

              MESSAGE_ID="$(jq -r '.result.message_id // empty' <<<"${RESPONSE}")"
              if [[ -z "${MESSAGE_ID}" ]]; then
                echo "Telegram sendMessage returned no message_id for ${FILE}." >&2
                exit 1
              fi

              # Persist immediately after sendMessage so a later editorial run
              # can safely edit this exact Telegram post.
              persist_state "${STATE_FILE}" "${FILE}" "${EDITION}" "${MESSAGE_ID}"
              continue
            fi

            if [[ -z "${STATE_JSON}" ]]; then
              echo "No Telegram state found for modified teaser ${FILE}." >&2
              echo "Refusing to send a replacement message because that would create a duplicate." >&2
              exit 1
            fi

            MESSAGE_ID="$(jq -r '.message_id // empty' <<<"${STATE_JSON}")"
            if [[ -z "${MESSAGE_ID}" ]]; then
              echo "Telegram state has no message_id: ${STATE_FILE}" >&2
              exit 1
            fi

            echo "Editing Telegram message ${MESSAGE_ID} from ${FILE} in ${EDITION} channel."
            telegram_call editMessageText \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "message_id=${MESSAGE_ID}" \
              --data-urlencode "text@${FILE}" \
              --data-urlencode "disable_web_page_preview=false" \
              >/dev/null
          done
