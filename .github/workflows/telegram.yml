name: Publish Telegram teaser

on:
  push:
    branches: [main]
    paths:
      - '_telegram/**/*.txt'

permissions:
  contents: read

env:
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find teaser and publish
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BOT_TOKEN}" || -z "${CHAT_ID}" ]]; then
            echo "Telegram secrets are not configured yet; skipping publication."
            exit 0
          fi

          FILE="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep '^_telegram/.*\.txt$' | head -n 1 || true)"
          if [[ -z "${FILE}" ]]; then
            echo "No Telegram teaser file found in this commit."
            exit 0
          fi

          SIZE="$(wc -c < "${FILE}")"
          if (( SIZE > 15000 )); then
            echo "Teaser file is unexpectedly large (${SIZE} bytes)."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text@${FILE}" \
            --data-urlencode "disable_web_page_preview=false"
