name: Telegram contact inbox

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-contact-inbox
  cancel-in-progress: false

env:
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Forward new bot messages to Carni
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BOT_TOKEN}" ]]; then
            echo "TELEGRAM_BOT_TOKEN is not configured; skipping."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          admin_chat_id = str(os.environ.get("ADMIN_CHAT_ID", "")).strip()
          base = f"https://api.telegram.org/bot{token}/"

          def api(method, params=None):
              data = None
              if params is not None:
                  data = urllib.parse.urlencode(params).encode("utf-8")
              req = urllib.request.Request(base + method, data=data)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if not payload.get("ok"):
                  raise RuntimeError(f"Telegram API error in {method}")
              return payload.get("result")

          updates = api("getUpdates", {
              "timeout": 0,
              "allowed_updates": json.dumps(["message"]),
          }) or []

          handled = 0
          for update in updates:
              update_id = update.get("update_id")
              message = update.get("message") or {}
              chat = message.get("chat") or {}
              sender = message.get("from") or {}
              source_chat_id = chat.get("id")
              message_id = message.get("message_id")

              if update_id is None or source_chat_id is None or message_id is None:
                  continue

              if chat.get("type") != "private":
                  api("getUpdates", {"offset": update_id + 1, "timeout": 0})
                  continue

              text = (message.get("text") or "").strip()

              if not admin_chat_id:
                  if text.startswith("/start"):
                      api("sendMessage", {
                          "chat_id": source_chat_id,
                          "text": (
                              "Связь с Carni почти настроена.\n\n"
                              f"Твой Telegram chat ID: {source_chat_id}\n\n"
                              "Его нужно один раз сохранить в GitHub как секрет TELEGRAM_ADMIN_CHAT_ID."
                          ),
                      })
                  else:
                      api("sendMessage", {
                          "chat_id": source_chat_id,
                          "text": "Связь с Carni пока настраивается. Попробуй чуть позже.",
                      })
                  api("getUpdates", {"offset": update_id + 1, "timeout": 0})
                  handled += 1
                  continue

              # Do not bounce Carni's own messages back to himself.
              if str(source_chat_id) == admin_chat_id:
                  api("getUpdates", {"offset": update_id + 1, "timeout": 0})
                  continue

              if text.startswith("/start"):
                  api("sendMessage", {
                      "chat_id": source_chat_id,
                      "text": "Связь с Carni. Напиши сюда сообщение — оно будет передано напрямую.",
                  })
              else:
                  username = sender.get("username")
                  first_name = sender.get("first_name") or ""
                  last_name = sender.get("last_name") or ""
                  display_name = " ".join(x for x in (first_name, last_name) if x).strip() or "Без имени"
                  username_text = f"@{username}" if username else "username не указан"

                  api("sendMessage", {
                      "chat_id": admin_chat_id,
                      "text": f"Новое сообщение с AI News by Carni\nОт: {display_name} · {username_text}",
                  })
                  api("forwardMessage", {
                      "chat_id": admin_chat_id,
                      "from_chat_id": source_chat_id,
                      "message_id": message_id,
                  })
                  api("sendMessage", {
                      "chat_id": source_chat_id,
                      "text": "Сообщение передано Carni.",
                  })

              api("getUpdates", {"offset": update_id + 1, "timeout": 0})
              handled += 1

          print(f"Handled {handled} Telegram update(s).")
          PY
