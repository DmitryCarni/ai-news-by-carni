name: Verify Daily OIDC wake contract

on:
  pull_request:
    paths:
      - '.github/workflows/daily-published-wake.yml'
      - '.github/workflows/publish-radar-staging.yml'
      - '.github/workflows/verify-daily-wake-contract.yml'
      - 'scripts/verify_daily_wake_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-published-wake.yml'
      - '.github/workflows/publish-radar-staging.yml'
      - '.github/workflows/verify-daily-wake-contract.yml'
      - 'scripts/verify_daily_wake_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify workflow YAML, minimal OIDC permissions, and exact publisher handoff
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python scripts/verify_daily_wake_workflow.py
