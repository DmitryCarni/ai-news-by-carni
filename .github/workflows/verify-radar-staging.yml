name: Verify Radar staging transaction

on:
  push:
    branches:
      - 'radar/daily-*'
      - 'radar/weekly-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact staging transaction
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          git fetch --no-tags origin main

          python - <<'PY'
          import os, re, subprocess, sys

          branch = os.environ["GITHUB_REF_NAME"]
          if branch.startswith("radar/daily-"):
              token = branch.removeprefix("radar/daily-")
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", token):
                  raise SystemExit(f"Invalid Daily staging branch: {branch}")
              expected = {
                  f"daily/{token}.md",
                  f"en/daily/{token}.md",
                  f"_telegram/daily/{token}.txt",
                  f"_telegram/en/daily/{token}.txt",
              }
              normalizer = ["python", "scripts/render_telegram_teaser.py", "--date", token, "--write"]
              verifier = ["python", "scripts/verify_daily_completeness.py"]
          elif branch.startswith("radar/weekly-"):
              token = branch.removeprefix("radar/weekly-")
              if not re.fullmatch(r"\d{4}-W\d{2}", token):
                  raise SystemExit(f"Invalid Weekly staging branch: {branch}")
              expected = {
                  f"weekly/{token}.md",
                  f"en/weekly/{token}.md",
                  f"_telegram/weekly/{token}.txt",
                  f"_telegram/en/weekly/{token}.txt",
              }
              normalizer = None
              verifier = ["python", "scripts/verify_weekly_completeness.py"]
          else:
              raise SystemExit(f"Unsupported staging branch: {branch}")

          changed = set(
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
              if line.strip()
          )

          if changed != expected:
              missing = sorted(expected - changed)
              extra = sorted(changed - expected)
              raise SystemExit(
                  "Radar staging must be one exact 4-file transaction. "
                  f"missing={missing} extra={extra}"
              )

          for path in sorted(expected):
              if not os.path.isfile(path):
                  raise SystemExit(f"Expected artifact missing from worktree: {path}")

          print(f"RADAR STAGING IDENTITY: {branch} -> {sorted(expected)}")
          if normalizer:
              subprocess.run(normalizer, check=True)
          subprocess.run(verifier, check=True)
          print("RADAR STAGING TRANSACTION: SUCCESS")
          PY
