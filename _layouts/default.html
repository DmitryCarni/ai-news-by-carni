<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <script>
    (() => {
      let theme = 'dark';
      try {
        if (localStorage.getItem('ai-news-theme') === 'light') theme = 'light';
      } catch (_) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">AI</span>
        <span><strong>AI News by Carni</strong><small>Тренды · Инструменты · Монетизация</small></span>
      </a>
      <div class="header-actions">
        <div class="header-telegram">Мы — в <a href="https://t.me/ai_news_by_carni" target="_blank" rel="noopener noreferrer">Telegram</a></div>
        <button id="theme-toggle" class="theme-button" type="button">
          <span class="theme-button-icon" aria-hidden="true">☀</span>
          <span class="theme-button-label">Светлая тема</span>
        </button>
      </div>
      <nav>
        <a href="{{ '/daily/' | relative_url }}">Новости</a>
        <a href="{{ '/weekly/' | relative_url }}">Главное за неделю</a>
        <a href="{{ '/about/' | relative_url }}">О проекте</a>
      </nav>
    </div>
  </header>
  <main class="wrap content">{{ content }}</main>
  <footer class="wrap footer">
    <span>AI News by Carni</span>
  </footer>
  <script>
    (() => {
      const button = document.getElementById('theme-toggle');
      if (!button) return;
      const icon = button.querySelector('.theme-button-icon');
      const label = button.querySelector('.theme-button-label');

      const applyTheme = (theme, remember) => {
        const isLight = theme === 'light';
        document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
        icon.textContent = isLight ? '☾' : '☀';
        label.textContent = isLight ? 'Тёмная тема' : 'Светлая тема';
        button.setAttribute('aria-label', isLight ? 'Включить тёмную тему' : 'Включить светлую тему');
        if (remember) {
          try { localStorage.setItem('ai-news-theme', isLight ? 'light' : 'dark'); } catch (_) {}
        }
      };

      applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark', false);
      button.addEventListener('click', () => {
        const nextTheme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        applyTheme(nextTheme, true);
      });
    })();
  </script>
</body>
</html>
