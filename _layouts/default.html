<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">AI</span>
        <span><strong>AI News by Carni</strong><small>Тренды · Инструменты · Монетизация</small></span>
      </a>
      <div class="header-telegram">Мы — в <a href="https://t.me/ai_news_by_carni" target="_blank" rel="noopener noreferrer">Telegram</a></div>
      <nav>
        <a href="{{ '/daily/' | relative_url }}">Новости</a>
        <a href="{{ '/weekly/' | relative_url }}">Главное за неделю</a>
        <a href="{{ '/about/' | relative_url }}">О проекте</a>
      </nav>
    </div>
  </header>
  <main class="wrap content">{{ content }}</main>
  <footer class="wrap footer">
    <span>AI News by Carni</span>
  </footer>
</body>
</html>
