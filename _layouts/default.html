<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">AI</span>
        <span><strong>AI News by Carni</strong><small>Тренды · Инструменты · Монетизация</small></span>
      </a>
      <div class="header-telegram">Мы — в <a href="https://t.me/ai_news_by_carni" target="_blank" rel="noopener noreferrer">Telegram</a></div>
      <nav>
        <a href="{{ '/daily/' | relative_url }}">Новости</a>
        <a href="{{ '/weekly/' | relative_url }}">Главное за неделю</a>
        <a href="{{ '/about/' | relative_url }}">О проекте</a>
      </nav>
    </div>
  </header>
  <main class="wrap content">{{ content }}</main>
  <footer class="wrap footer">
    <span>AI News by Carni</span>
  </footer>
  <script>
    (() => {
      const getTarget = (hash) => {
        if (!hash || hash === '#') return null;
        try {
          return document.getElementById(decodeURIComponent(hash.slice(1)));
        } catch (_) {
          return null;
        }
      };

      const scrollToHash = (hash, smooth) => {
        const target = getTarget(hash);
        if (!target) return false;
        const header = document.querySelector('.site-header');
        const headerHeight = header ? header.getBoundingClientRect().height : 0;
        const top = target.getBoundingClientRect().top + window.scrollY - headerHeight - 18;
        window.scrollTo({ top: Math.max(0, top), behavior: smooth ? 'smooth' : 'auto' });
        return true;
      };

      document.addEventListener('click', (event) => {
        const link = event.target.closest('a[href^="#"]');
        if (!link) return;
        const hash = link.getAttribute('href');
        if (!getTarget(hash)) return;
        event.preventDefault();
        history.pushState(null, '', hash);
        scrollToHash(hash, true);
      });

      window.addEventListener('hashchange', () => scrollToHash(window.location.hash, false));

      if (window.location.hash) {
        requestAnimationFrame(() => requestAnimationFrame(() => scrollToHash(window.location.hash, false)));
      }
    })();
  </script>
</body>
</html>
